name: ap-si-replies
on:
  schedule:
    - cron: "*/10 * * * *"  # inbox check every 10 min, cloud-free
  workflow_dispatch:
jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python bot.py --poll-once
        working-directory: ap_si_telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - run: |
          git config user.name "ap-si-bot"
          git config user.email "bot@local"
          git add ap_si_telegram/.offset ap_si_telegram/scores.json
          git diff --cached --quiet || (git commit -m "bot offset+scores" && git push)
