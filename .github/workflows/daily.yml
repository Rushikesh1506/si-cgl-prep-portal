name: ap-si-daily
on:
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST recall quiz
    - cron: "30 4 * * *"   # 10:00 AM IST learn pack
    - cron: "30 12 * * *"  # 6:00 PM IST revision quiz
  workflow_dispatch:
    inputs:
      slot:
        description: "morning or evening"
        required: false
        default: "auto"
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          SLOT="morning"
          H=$(date -u +%H)
          if [ "$H" = "04" ]; then SLOT="learn"; fi
          if [ "$H" = "12" ]; then SLOT="evening"; fi
          python bot.py --post $SLOT
        working-directory: ap_si_telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
