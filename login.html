<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — AP SI Prep Portal</title>
<style>
  :root{ --ink:#eef2fb; --muted:#9aa7c7; --line:rgba(255,255,255,.14);
    --navy:#070b18; --navy2:#0d1530; --azure:#3b6bff; --violet:#8b5cf6; --amber:#ffb84d;
    --green:#34d399; --red:#f87171; --radius:18px;
    --glass:rgba(16,22,46,.55); --glass-line:rgba(255,255,255,.12); }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;min-height:100vh;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--ink);perspective:1400px}

  .split{display:grid;grid-template-columns:1.15fr 1fr;min-height:100vh}
  @media (max-width:900px){ .split{grid-template-columns:1fr} }

  /* ================= LEFT: illustrated night-skyline scene ================= */
  .illus-pane{position:relative;overflow:hidden;
    background:linear-gradient(180deg,#040611 0%,#0a1230 42%,#162659 78%,#1d3272 100%)}
  @media (max-width:900px){ .illus-pane{min-height:34vh} }

  .sky{position:absolute;inset:0}
  .spark{position:absolute;width:2.5px;height:2.5px;border-radius:50%;background:#fff;opacity:0;
    animation:twinkle linear infinite}
  @keyframes twinkle{0%{opacity:0}10%{opacity:.95}90%{opacity:.25}100%{opacity:0}}

  .cloud{position:absolute;border-radius:50%;filter:blur(30px);opacity:.18;background:#6d93ff;
    animation:cloud-drift ease-in-out infinite}
  @keyframes cloud-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(5vw)}}

  /* Glowing badge-moon with pulsing "radar" rings */
  .badge-wrap{position:absolute;top:13%;right:16%;width:150px;height:150px}
  .badge-glow{position:absolute;inset:-60px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,184,77,.35),transparent 65%);filter:blur(4px)}
  .ping{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,184,77,.5);
    animation:ping 3.6s cubic-bezier(.3,.6,.4,1) infinite}
  .ping2{animation-delay:1.2s} .ping3{animation-delay:2.4s}
  @keyframes ping{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.9);opacity:0}}
  .badge{position:absolute;inset:28px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff6e6,#ffcf7a 45%,#e9a53d 100%);
    box-shadow:0 0 50px 10px rgba(255,184,77,.55), inset -8px -8px 18px rgba(170,100,0,.35);
    display:grid;place-items:center;font-size:30px}

  /* Skyline silhouette, two depth layers, built in JS */
  .skyline{position:absolute;left:0;right:0;bottom:0;height:46%}
  .skyline .layer{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end}
  .skyline .back{height:100%;opacity:.55}
  .skyline .back .b{background:#13214a}
  .skyline .front{height:100%}
  .skyline .front .b{background:#070a16}
  .b{position:relative;flex-shrink:0}
  .b .win{position:absolute;width:3px;height:4px;background:rgba(255,200,110,.85)}
  .tower{position:relative}
  .tower::before{content:"";position:absolute;left:50%;top:-16px;width:2px;height:16px;background:#070a16;transform:translateX(-50%)}
  .tower::after{content:"";position:absolute;left:50%;top:-20px;width:5px;height:5px;border-radius:50%;
    background:var(--red);transform:translateX(-50%);box-shadow:0 0 6px 2px rgba(248,113,113,.8);
    animation:beacon 1.6s ease-in-out infinite}
  @keyframes beacon{0%,100%{opacity:1}50%{opacity:.25}}

  .tagline{position:absolute;left:7%;bottom:50%;max-width:420px;z-index:2}
  .tagline .kicker{font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--amber);margin:0 0 10px}
  .tagline h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.6rem,1.1rem + 2vw,2.4rem);
    line-height:1.18;margin:0 0 12px;color:#fff}
  .tagline p{font-size:.92rem;color:#c7d2f0;margin:0;line-height:1.6}
  @media (max-width:900px){ .tagline{display:none} }

  /* ================= RIGHT: form pane ================= */
  .form-pane{position:relative;display:grid;place-items:center;padding:28px 20px;
    background:radial-gradient(900px 600px at 80% 20%, rgba(59,107,255,.14), transparent 60%), var(--navy2)}

  .stage{position:relative;z-index:1;transform-style:preserve-3d;transition:transform .12s ease-out}
  .card{background:var(--glass);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
    border:1px solid var(--glass-line);border-radius:var(--radius);
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03) inset;
    padding:34px 30px;width:100%;max-width:380px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .brand-mark{font-size:24px;background:linear-gradient(135deg,var(--azure),var(--violet));
    color:#fff;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;
    box-shadow:0 8px 24px rgba(59,107,255,.4)}
  h1{font-size:1.15rem;margin:0;letter-spacing:.2px}
  p.sub{margin:4px 0 0;font-size:.82rem;color:var(--muted)}
  .profiles{display:flex;flex-direction:column;gap:10px;margin:18px 0}
  .profile-btn{padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;text-align:left;
    background:rgba(255,255,255,.04);cursor:pointer;font-weight:700;font-size:.95rem;color:var(--ink);
    transition:.15s}
  .profile-btn small{display:block;font-weight:500;font-size:.74rem;color:var(--muted);margin-top:2px}
  .profile-btn:hover{border-color:var(--azure);background:rgba(59,107,255,.1)}
  .profile-btn.active{border-color:var(--azure);background:rgba(59,107,255,.16);
    box-shadow:0 0 0 3px rgba(59,107,255,.18)}
  .step2{display:none;margin-top:4px}
  .step2.show{display:block}
  .back-link{background:none;border:none;color:var(--muted);font-size:.8rem;cursor:pointer;padding:0;margin-bottom:10px}
  .back-link:hover{color:var(--ink)}
  .who{font-size:.95rem;font-weight:700;margin-bottom:2px}
  label{display:block;font-size:.82rem;color:var(--muted);margin:14px 0 6px}
  input[type=password],input[type=text]{width:100%;padding:12px 14px;border:1.5px solid var(--line);
    border-radius:10px;font-size:1.3rem;letter-spacing:6px;text-align:center;
    background:rgba(255,255,255,.05);color:var(--ink)}
  input[type=password]:focus,input[type=text]:focus{outline:none;border-color:var(--azure);
    box-shadow:0 0 0 3px rgba(59,107,255,.22)}
  .btn{width:100%;margin-top:18px;padding:12px;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--azure),var(--violet));color:#fff;font-weight:700;
    font-size:.95rem;cursor:pointer;box-shadow:0 10px 26px rgba(59,107,255,.35)}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .msg{margin-top:12px;font-size:.82rem;min-height:18px}
  .msg.err{color:var(--red)}
  .msg.ok{color:var(--green)}

  @media (prefers-reduced-motion: reduce){
    .spark,.cloud,.ping,.tower::after{animation:none !important}
    .stage{transform:none !important}
  }
</style>
</head>
<body>

<div class="split">

  <div class="illus-pane" id="illusPane" aria-hidden="true">
    <div class="sky" id="sky"></div>
    <div class="cloud" style="width:260px;height:90px;left:8%;top:22%;animation-duration:18s"></div>
    <div class="cloud" style="width:200px;height:70px;left:55%;top:14%;animation-duration:22s;animation-delay:2s"></div>

    <div class="badge-wrap">
      <div class="badge-glow"></div>
      <div class="ping"></div>
      <div class="ping ping2"></div>
      <div class="ping ping3"></div>
      <div class="badge">🛡️</div>
    </div>

    <div class="tagline">
      <p class="kicker">AP Police SI · Mains Track</p>
      <h2>Discipline today.<br>Badge tomorrow.</h2>
      <p>Sign in to pick up exactly where you left off — notes, diagnostics and
        focus ratings, synced the moment you come back.</p>
    </div>

    <div class="skyline" id="skyline">
      <div class="layer back" id="backLayer"></div>
      <div class="layer front" id="frontLayer"></div>
    </div>
  </div>

  <div class="form-pane">
    <div class="stage" id="stage">
    <div class="card">
      <div class="brand">
        <div class="brand-mark">🎯</div>
        <div>
          <h1>AP SI Prep Portal</h1>
          <p class="sub">Sign in to sync your progress</p>
        </div>
      </div>

      <div class="profiles" id="profiles">
        <button class="profile-btn" data-name="KrishnaChetan" data-role="student">KrishnaChetan<small>Student</small></button>
        <button class="profile-btn" data-name="Rushikesh" data-role="developer">Rushikesh<small>Developer</small></button>
      </div>

      <div class="step2" id="step2">
        <button type="button" class="back-link" id="backBtn">← Choose a different profile</button>
        <p class="who" id="whoLabel"></p>
        <label for="pin">4-digit PIN</label>
        <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" />
        <button class="btn" id="goBtn" disabled>Verify &amp; sign in</button>
        <p class="msg" id="msg"></p>
      </div>
    </div>
    </div>
  </div>

</div>

<script>
/* Decorative only: stars + procedural skyline silhouette + mouse-tracked 3D
   card tilt. No effect on the login logic below, and mostly disabled under
   prefers-reduced-motion (the skyline itself, being static once built, stays). */
(function () {
  "use strict";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const sky = document.getElementById("sky");
  for (let i = 0; i < 70; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 55 + "%";
    if (!reduceMotion) {
      s.style.animationDuration = 4 + Math.random() * 8 + "s";
      s.style.animationDelay = Math.random() * 8 + "s";
    } else {
      s.style.opacity = ".6";
    }
    sky.appendChild(s);
  }

  /* Procedural building silhouette - deterministic (not Math.random) so the
     skyline composition is stable across reloads. */
  function buildSkyline(el, heights, widths, withWindows, towerIndex) {
    heights.forEach((h, i) => {
      const b = document.createElement("div");
      b.className = "b" + (i === towerIndex ? " tower" : "");
      b.style.width = widths[i % widths.length] + "px";
      b.style.height = h + "%";
      if (withWindows) {
        const rows = Math.floor(h / 9), cols = Math.max(1, Math.floor(widths[i % widths.length] / 10));
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          if ((r + c * 3 + i) % 4 !== 0) continue;
          const w = document.createElement("div");
          w.className = "win";
          w.style.left = 5 + c * 10 + "px";
          w.style.bottom = 6 + r * 9 + "px";
          b.appendChild(w);
        }
      }
      el.appendChild(b);
    });
  }
  buildSkyline(document.getElementById("backLayer"),
    [40, 55, 35, 62, 48, 70, 44, 58, 38, 50, 64, 42, 56, 46], [26, 34, 22, 30, 24], false, -1);
  buildSkyline(document.getElementById("frontLayer"),
    [58, 80, 46, 68, 100, 54, 72, 60, 42, 66, 50], [30, 40, 26, 36, 32], true, 4);

  if (reduceMotion) return;

  const stage = document.getElementById("stage");
  let raf = null;
  window.addEventListener("mousemove", (e) => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      const dx = (e.clientX / window.innerWidth - 0.5) * 2;
      const dy = (e.clientY / window.innerHeight - 0.5) * 2;
      stage.style.transform = `rotateY(${dx * 5}deg) rotateX(${-dy * 5}deg)`;
      raf = null;
    });
  });
  window.addEventListener("mouseleave", () => { stage.style.transform = "rotateY(0) rotateX(0)"; });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supa-config.js"></script>
<script src="supa.js"></script>
<script>
"use strict";
let chosen = null, chosenRole = null, submitting = false;
const profilesEl = document.getElementById("profiles");
const step2El = document.getElementById("step2");
const whoEl = document.getElementById("whoLabel");
const pinEl = document.getElementById("pin");
const goBtn = document.getElementById("goBtn");
const msgEl = document.getElementById("msg");
const backBtn = document.getElementById("backBtn");

profilesEl.addEventListener("click", (e) => {
  const b = e.target.closest(".profile-btn");
  if (!b) return;
  chosen = b.dataset.name;
  chosenRole = b.dataset.role;
  [...profilesEl.children].forEach((c) => c.classList.toggle("active", c === b));
  whoEl.textContent = "Enter the PIN for " + chosen;
  step2El.classList.add("show");
  pinEl.value = "";
  setMsg("");
  refreshBtn();
  pinEl.focus();
});

backBtn.addEventListener("click", () => {
  chosen = null; chosenRole = null;
  step2El.classList.remove("show");
  [...profilesEl.children].forEach((c) => c.classList.remove("active"));
  setMsg("");
});

pinEl.addEventListener("input", () => {
  pinEl.value = pinEl.value.replace(/\D/g, "").slice(0, 4);
  refreshBtn();
  if (pinEl.value.length === 4 && !submitting) doLogin();
});
function refreshBtn() { goBtn.disabled = !(chosen && pinEl.value.length === 4); }

function setMsg(text, cls) { msgEl.textContent = text; msgEl.className = "msg" + (cls ? " " + cls : ""); }

async function doLogin() {
  if (!chosen || pinEl.value.length !== 4 || submitting) return;
  submitting = true;
  goBtn.disabled = true;
  setMsg("Checking with Supabase…");
  try {
    const sess = await Supa.login(chosen, pinEl.value, chosenRole);
    setMsg("Signed in as " + sess.name + " — redirecting…", "ok");
    setTimeout(() => {
      window.location.href = sess.role === "developer" ? "mentor.html" : "welcome.html";
    }, 350);
  } catch (e) {
    setMsg(e.message || "Sign-in failed", "err");
    pinEl.value = "";
    submitting = false;
    refreshBtn();
    pinEl.focus();
  }
}
goBtn.addEventListener("click", doLogin);
pinEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !goBtn.disabled) doLogin(); });
</script>
</body>
</html>
