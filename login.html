<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — AP SI Prep Portal</title>
<style>
  :root{ --ink:#eafbf3; --muted:#9fc6b4; --line:rgba(255,255,255,.14);
    --base:#061512; --base2:#07201a; --emerald:#1fdf8e; --gold:#f3c23c;
    --green:#34d399; --red:#f87171; --radius:18px;
    --glass:rgba(8,28,23,.58); --glass-line:rgba(255,255,255,.12); }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;min-height:100vh;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--ink);perspective:1400px}

  .split{display:grid;grid-template-columns:1.15fr 1fr;min-height:100vh}
  @media (max-width:900px){ .split{grid-template-columns:1fr} }

  /* ================= LEFT: photo pane (slow Ken-Burns zoom) ================= */
  .illus-pane{position:relative;overflow:hidden;background:#071a15}
  .illus-pane .photo{position:absolute;inset:-3%;background-image:url("assets/study-room.jpg?v=1");
    background-size:cover;background-position:center;animation:kenburns 24s ease-in-out infinite alternate}
  @keyframes kenburns{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.08) translate(-1%,-1%)}}
  .illus-pane .fade{position:absolute;inset:0;
    background:linear-gradient(100deg, rgba(6,21,18,.58) 0%, rgba(6,21,18,.12) 45%, rgba(6,21,18,.8) 100%)}
  @media (max-width:900px){ .illus-pane{min-height:30vh} }

  /* ================= RIGHT: form pane - lively animated backdrop ================= */
  .form-pane{position:relative;overflow:hidden;display:grid;place-items:center;padding:28px 20px;
    background:var(--base2)}
  .blob{position:absolute;border-radius:50%;filter:blur(55px);will-change:transform;opacity:.5}
  .blob1{width:60vmin;height:60vmin;left:-18vmin;top:-14vmin;background:radial-gradient(circle,var(--emerald),transparent 70%);
    animation:blobA 16s ease-in-out infinite}
  .blob2{width:46vmin;height:46vmin;right:-14vmin;bottom:-12vmin;background:radial-gradient(circle,var(--gold),transparent 72%);
    opacity:.35;animation:blobB 20s ease-in-out infinite}
  .blob3{width:36vmin;height:36vmin;right:10vmin;top:8vmin;background:radial-gradient(circle,#0ea5e9,transparent 72%);
    opacity:.22;animation:blobC 24s ease-in-out infinite}
  @keyframes blobA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmin,8vmin) scale(1.15)}}
  @keyframes blobB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-7vmin,-6vmin) scale(1.1)}}
  @keyframes blobC{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-5vmin,7vmin) scale(1.2)}}
  .sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .spark{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 6px 1px rgba(243,194,60,.8);opacity:0;animation:rise linear infinite}
  @keyframes rise{0%{opacity:0;transform:translateY(0)}12%{opacity:.9}88%{opacity:.3}100%{opacity:0;transform:translateY(-70vh)}}

  .onboard{width:100%;max-width:380px;margin-bottom:14px;padding:14px 16px;border-radius:14px;
    background:rgba(243,194,60,.1);border:1px solid rgba(243,194,60,.3);
    display:none;gap:10px;align-items:flex-start;position:relative;z-index:1}
  .onboard.show{display:flex}
  .onboard .ic{font-size:18px;line-height:1.3}
  .onboard p{margin:0;font-size:.82rem;color:#ffe9b3;line-height:1.5}
  .onboard b{color:#fff}
  .onboard .close{position:absolute;top:8px;right:10px;background:none;border:none;color:#ffe9b3;
    opacity:.7;cursor:pointer;font-size:14px;padding:4px}
  .onboard .close:hover{opacity:1}

  .stage{position:relative;z-index:1;transform-style:preserve-3d;transition:transform .12s ease-out}
  .card{background:var(--glass);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
    border:1px solid var(--glass-line);border-radius:var(--radius);
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03) inset;
    padding:34px 30px;width:100%;max-width:380px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .brand-mark{font-size:24px;background:linear-gradient(135deg,var(--emerald),var(--gold));
    color:#06201a;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;
    box-shadow:0 8px 24px rgba(31,223,142,.4)}
  h1{font-size:1.15rem;margin:0;letter-spacing:.2px}
  p.sub{margin:4px 0 0;font-size:.82rem;color:var(--muted)}
  .profiles{display:flex;flex-direction:column;gap:10px;margin:18px 0}
  .profile-btn{padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;text-align:left;
    background:rgba(255,255,255,.04);cursor:pointer;font-weight:700;font-size:.95rem;color:var(--ink);
    transition:.15s}
  .profile-btn small{display:block;font-weight:500;font-size:.74rem;color:var(--muted);margin-top:2px}
  .profile-btn:hover{border-color:var(--emerald);background:rgba(31,223,142,.1)}
  .profile-btn.active{border-color:var(--emerald);background:rgba(31,223,142,.16);
    box-shadow:0 0 0 3px rgba(31,223,142,.18)}
  .step2{display:none;margin-top:4px}
  .step2.show{display:block}
  .back-link{background:none;border:none;color:var(--muted);font-size:.8rem;cursor:pointer;padding:0;margin-bottom:10px}
  .back-link:hover{color:var(--ink)}
  .who{font-size:.95rem;font-weight:700;margin-bottom:2px}
  label{display:block;font-size:.82rem;color:var(--muted);margin:14px 0 6px}
  input[type=password],input[type=text]{width:100%;padding:12px 14px;border:1.5px solid var(--line);
    border-radius:10px;font-size:1.3rem;letter-spacing:6px;text-align:center;
    background:rgba(255,255,255,.05);color:var(--ink)}
  input[type=password]:focus,input[type=text]:focus{outline:none;border-color:var(--emerald);
    box-shadow:0 0 0 3px rgba(31,223,142,.22)}
  .btn{width:100%;margin-top:18px;padding:12px;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--emerald),var(--gold));color:#06201a;font-weight:800;
    font-size:.95rem;cursor:pointer;box-shadow:0 10px 26px rgba(31,223,142,.35)}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .msg{margin-top:12px;font-size:.82rem;min-height:18px}
  .msg.err{color:var(--red)}
  .msg.ok{color:var(--green)}

  @media (prefers-reduced-motion: reduce){
    .stage{transform:none !important}
    .photo,.blob1,.blob2,.blob3,.spark{animation:none !important}
  }
</style>
</head>
<body>

<div class="split">

  <div class="illus-pane" aria-hidden="true">
    <div class="photo"></div>
    <div class="fade"></div>
  </div>

  <div class="form-pane">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <div class="sparks" id="sparks"></div>
    <div class="onboard" id="onboard">
      <span class="ic">📊</span>
      <p><b>First time here?</b> Sign in, then take the <b>Diagnostic Mock</b> from the
        home page — it's built from a real previous-year paper and is the fastest way
        to see exactly where you stand before planning anything.</p>
      <button type="button" class="close" id="onboardClose" aria-label="Dismiss">✕</button>
    </div>

    <div class="stage" id="stage">
    <div class="card">
      <div class="brand">
        <div class="brand-mark">🎯</div>
        <div>
          <h1>AP SI Prep Portal</h1>
          <p class="sub">Sign in to sync your progress</p>
        </div>
      </div>

      <div class="profiles" id="profiles">
        <button class="profile-btn" data-name="KrishnaChetan" data-role="student">KrishnaChetan<small>Student</small></button>
        <button class="profile-btn" data-name="Rushikesh" data-role="developer">Rushikesh<small>Developer</small></button>
      </div>

      <div class="step2" id="step2">
        <button type="button" class="back-link" id="backBtn">← Choose a different profile</button>
        <p class="who" id="whoLabel"></p>
        <label for="pin">4-digit PIN</label>
        <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" />
        <button class="btn" id="goBtn" disabled>Verify &amp; sign in</button>
        <p class="msg" id="msg"></p>
      </div>
    </div>
    </div>
  </div>

</div>

<script>
/* First-visit nudge toward the diagnostic assessment - shown once per
   browser until dismissed or until the person signs in. */
(function () {
  "use strict";
  const KEY = "si_seen_onboarding";
  if (!localStorage.getItem(KEY)) {
    document.getElementById("onboard").classList.add("show");
  }
  document.getElementById("onboardClose").addEventListener("click", () => {
    localStorage.setItem(KEY, "1");
    document.getElementById("onboard").classList.remove("show");
  });
})();

/* Decorative only: rising gold sparks behind the card + mouse-tracked 3D
   card tilt. No effect on the login logic below, disabled under
   prefers-reduced-motion. */
(function () {
  "use strict";
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const sparks = document.getElementById("sparks");
  for (let i = 0; i < 22; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = 40 + Math.random() * 60 + "%";
    s.style.animationDuration = 5 + Math.random() * 9 + "s";
    s.style.animationDelay = Math.random() * 9 + "s";
    sparks.appendChild(s);
  }

  const stage = document.getElementById("stage");
  let raf = null;
  window.addEventListener("mousemove", (e) => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      const dx = (e.clientX / window.innerWidth - 0.5) * 2;
      const dy = (e.clientY / window.innerHeight - 0.5) * 2;
      stage.style.transform = `rotateY(${dx * 5}deg) rotateX(${-dy * 5}deg)`;
      raf = null;
    });
  });
  window.addEventListener("mouseleave", () => { stage.style.transform = "rotateY(0) rotateX(0)"; });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supa-config.js"></script>
<script src="supa.js"></script>
<script>
"use strict";
let chosen = null, chosenRole = null, submitting = false;
const profilesEl = document.getElementById("profiles");
const step2El = document.getElementById("step2");
const whoEl = document.getElementById("whoLabel");
const pinEl = document.getElementById("pin");
const goBtn = document.getElementById("goBtn");
const msgEl = document.getElementById("msg");
const backBtn = document.getElementById("backBtn");

profilesEl.addEventListener("click", (e) => {
  const b = e.target.closest(".profile-btn");
  if (!b) return;
  chosen = b.dataset.name;
  chosenRole = b.dataset.role;
  [...profilesEl.children].forEach((c) => c.classList.toggle("active", c === b));
  whoEl.textContent = "Enter the PIN for " + chosen;
  step2El.classList.add("show");
  pinEl.value = "";
  setMsg("");
  refreshBtn();
  pinEl.focus();
});

backBtn.addEventListener("click", () => {
  chosen = null; chosenRole = null;
  step2El.classList.remove("show");
  [...profilesEl.children].forEach((c) => c.classList.remove("active"));
  setMsg("");
});

pinEl.addEventListener("input", () => {
  pinEl.value = pinEl.value.replace(/\D/g, "").slice(0, 4);
  refreshBtn();
  if (pinEl.value.length === 4 && !submitting) doLogin();
});
function refreshBtn() { goBtn.disabled = !(chosen && pinEl.value.length === 4); }

function setMsg(text, cls) { msgEl.textContent = text; msgEl.className = "msg" + (cls ? " " + cls : ""); }

async function doLogin() {
  if (!chosen || pinEl.value.length !== 4 || submitting) return;
  submitting = true;
  goBtn.disabled = true;
  setMsg("Checking with Supabase…");
  try {
    const sess = await Supa.login(chosen, pinEl.value, chosenRole);
    localStorage.setItem("si_seen_onboarding", "1");
    const firstLoginKey = "si_first_login_" + sess.name;
    const isFirstLogin = !localStorage.getItem(firstLoginKey);
    localStorage.setItem(firstLoginKey, "1");
    let dest = "welcome.html";
    if (sess.role === "developer") dest = "mentor.html";
    else if (isFirstLogin) dest = "ap-mains-diagnostic.html?mock=mains2023_gs";
    setMsg("Signed in as " + sess.name + (isFirstLogin && sess.role !== "developer"
      ? " — let's see where you stand first…" : " — redirecting…"), "ok");
    setTimeout(() => { window.location.href = dest; }, 350);
  } catch (e) {
    setMsg(e.message || "Sign-in failed", "err");
    pinEl.value = "";
    submitting = false;
    refreshBtn();
    pinEl.focus();
  }
}
goBtn.addEventListener("click", doLogin);
pinEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !goBtn.disabled) doLogin(); });
</script>
</body>
</html>
